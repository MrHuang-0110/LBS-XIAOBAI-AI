[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xiaobai-programmer"
version = "0.1.0"
description = "小白-Ai Blockly 图形编程上位机（BLE + 离线 Blockly）"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.6,<7",
    "bleak>=0.22,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
xiaobai-programmer = "xiaobai.ui.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
